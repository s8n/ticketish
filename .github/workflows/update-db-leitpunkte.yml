name: Update DB Leitpunkt names

# The route points in a DB Via text are defined in part 6 of the
# Entfernungswerk, which DB publishes as a PDF with the Deutschlandtarif price
# list. A new edition lands each December, and stations are renamed in it
# (Letmathe became Iserlohn-Letmathe), so a monthly look is enough to catch it.
# The link carries the edition in its name, so the script finds it on the AGB
# page rather than pinning it.
on:
  schedule:
    - cron: '38 4 6 * *' # 04:38 UTC on the 6th of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # pdftotext reads the PDF's four columns apart; a generic text
        # extractor runs them together
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Rebuild Leitpunkt table
        run: python scripts/build-db-leitpunkte.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/lib/tickets/data/db-leitpunkte.json; then
            echo "No changes to the Leitpunkt table."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tickets/data/db-leitpunkte.json
          git commit -m "Update DB Leitpunkt names"
          git push
