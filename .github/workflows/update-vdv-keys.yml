name: Update VDV CA keys

# The VDV KA certificate authorities publish new CV certificates over time
# (a new generation roughly every five years, plus occasional additions).
# Rebuild the vendored key store from their public LDAP directory.
on:
  schedule:
    - cron: '17 4 1 * *' # 04:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ldap3

      - name: Rebuild VDV CA key store
        run: python scripts/build-vdv-keys.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/lib/tickets/vdv/ca-keys.json; then
            echo "No changes to the VDV CA key store."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tickets/vdv/ca-keys.json
          git commit -m "Update VDV CA keys"
          git push
