name: Update TCDD station names

# The newer TCDD barcode layout identifies stations by numeric id. The names
# come from the station list TCDD's own e-ticket site reads, which needs no
# credentials.
on:
  schedule:
    - cron: '17 4 3 * *' # 04:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild TCDD station table
        run: python scripts/build-tcdd-stations.py

      # A table the tests reject is not committed: nothing else checks a bot push.
      - uses: ./.github/actions/check

      - uses: ./.github/actions/commit-tables
        with:
          paths: src/lib/tickets/tcdd/stations.json
          message: Update TCDD station names
