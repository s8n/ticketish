name: Update TCDD station names

# The newer TCDD barcode layout identifies stations by numeric id. The names
# come from the station list TCDD's own e-ticket site reads, which needs no
# credentials.
on:
  schedule:
    - cron: '17 4 3 * *' # 04:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild TCDD station table
        run: python scripts/build-tcdd-stations.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/lib/tickets/tcdd/stations.json; then
            echo "No changes to the TCDD station table."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tickets/tcdd/stations.json
          git commit -m "Update TCDD station names"
          git push
