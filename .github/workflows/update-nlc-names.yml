name: Update UK NLC station names

# UK RSP6 tickets identify stations by NLC code. The names come from the
# RDG/National Rail fares feed, which is refreshed regularly.
#
# Needs a free National Rail Open Data account, stored as the NR_USERNAME and
# NR_PASSWORD repository secrets. Without them the build script exits cleanly
# and nothing is committed.
on:
  schedule:
    - cron: '43 4 2 * *' # 04:43 UTC on the 2nd of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild NLC name table
        env:
          NR_USERNAME: ${{ secrets.NR_USERNAME }}
          NR_PASSWORD: ${{ secrets.NR_PASSWORD }}
        run: python scripts/build-nlc-names.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/lib/tickets/rsp/nlc.json; then
            echo "No changes to the NLC name table."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tickets/rsp/nlc.json
          git commit -m "Update UK NLC station names"
          git push
