name: Update UK NLC station names

# UK RSP6 tickets identify stations by NLC code. The names come from the
# RDG/National Rail fares feed, which is refreshed regularly.
#
# Needs a free National Rail Open Data account, stored as the NR_USERNAME and
# NR_PASSWORD repository secrets. Without them the build script exits cleanly
# and nothing is committed.
on:
  schedule:
    - cron: '43 4 2,16 * *' # 04:43 UTC on the 2nd and 16th of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild NLC name table
        env:
          NR_USERNAME: ${{ secrets.NR_USERNAME }}
          NR_PASSWORD: ${{ secrets.NR_PASSWORD }}
        run: python scripts/build-nlc-names.py

      # A table the tests reject is not committed: nothing else checks a bot push.
      - uses: ./.github/actions/check

      - uses: ./.github/actions/commit-tables
        with:
          paths: src/lib/tickets/rsp/nlc.json
          message: Update UK NLC station names
