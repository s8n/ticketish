name: Update Renfe station names

# Renfe barcodes identify stations by Renfe's own code. The names come from
# the "Estaciones. Listado completo" dataset Renfe publishes as open data,
# which needs no credentials. Stations get renamed there (Madrid-Puerta de
# Atocha-Almudena Grandes, Córdoba-Julio Anguita), so it is worth refreshing.
on:
  schedule:
    - cron: '52 4 5 * *' # 04:52 UTC on the 5th of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Renfe station table
        run: python scripts/build-renfe-stations.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/lib/tickets/renfe/stations.json; then
            echo "No changes to the Renfe station table."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tickets/renfe/stations.json
          git commit -m "Update Renfe station names"
          git push
